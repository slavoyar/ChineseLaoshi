# Local/dev compose — production uses `docker run` on the nginx-proxy network.
# See README.md (Production) and .github/workflows/deploy.yml.

services:
  backend:
    image: ${REGISTRY_IMAGE:-chinese-laoshi:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: chinese-laoshi
    restart: always
    ports:
      - "${HOST_PORT:-3000}:80"
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      DEFAULT_USER_EMAIL: ${DEFAULT_USER_EMAIL:-}
      TEMPLATE_USER_EMAIL: ${TEMPLATE_USER_EMAIL:-}
      DB_URL: ${DB_URL:-}
      DATA_DIR: /app/data/pg
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ${PG_DATA_HOST_PATH:-./data}:/app/data
