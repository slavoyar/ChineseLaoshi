server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log off;
    error_log /dev/stderr warn;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location ~ ^/(groups|write-practice)(/|$) {
        return 301 /app$request_uri;
    }

    # Discovery Link headers only for site documents (not /api/)
    location = / {
        add_header Link "</sitemap.xml>; rel=\"sitemap\", </llms.txt>; rel=\"describedby\"; type=\"text/plain\", </about>; rel=\"about\"" always;
        try_files /index.html =404;
    }

    location = /about {
        add_header Link "</sitemap.xml>; rel=\"sitemap\", </llms.txt>; rel=\"describedby\"; type=\"text/plain\"" always;
        try_files /about.html =404;
    }

    location = /about.html {
        return 301 /about;
    }

    location = /llms.txt {
        add_header Link "</sitemap.xml>; rel=\"sitemap\", </about>; rel=\"about\"" always;
        default_type text/plain;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
