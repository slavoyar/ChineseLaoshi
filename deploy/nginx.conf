server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log off;
    error_log /dev/stderr warn;

    location /models/ {
        types {
            application/json json;
            text/plain txt;
            application/octet-stream bin;
        }
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    location = /app {
        return 301 /app/;
    }

    location = /app/ {
        try_files /app.html =404;
    }

    location /app/ {
        try_files $uri $uri/ /app.html;
    }

    location ~ ^/(groups|write-practice)(/|$) {
        return 301 /app$request_uri;
    }

    # Discovery Link headers only for site documents (not /api/)
    location = / {
        add_header Link "</sitemap.xml>; rel=\"sitemap\", </llms.txt>; rel=\"describedby\"; type=\"text/plain\", </about>; rel=\"about\"" always;
        try_files /index.html =404;
    }

    location = /about {
        add_header Link "</sitemap.xml>; rel=\"sitemap\", </llms.txt>; rel=\"describedby\"; type=\"text/plain\"" always;
        try_files /about.html =404;
    }

    location = /about.html {
        return 301 /about;
    }

    location = /about/ {
        return 301 /about;
    }

    location = /hanzi-handwriting-practice {
        add_header Link "</sitemap.xml>; rel=\"sitemap\", </llms.txt>; rel=\"describedby\"; type=\"text/plain\"" always;
        try_files /hanzi-handwriting-practice.html =404;
    }

    location = /hanzi-handwriting-practice.html {
        return 301 /hanzi-handwriting-practice;
    }

    location = /hanzi-handwriting-practice/ {
        return 301 /hanzi-handwriting-practice;
    }

    location = /mandarin-flashcards {
        add_header Link "</sitemap.xml>; rel=\"sitemap\", </llms.txt>; rel=\"describedby\"; type=\"text/plain\"" always;
        try_files /mandarin-flashcards.html =404;
    }

    location = /mandarin-flashcards.html {
        return 301 /mandarin-flashcards;
    }

    location = /mandarin-flashcards/ {
        return 301 /mandarin-flashcards;
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Link "</llms.txt>; rel=\"describedby\"; type=\"text/plain\", </about>; rel=\"about\"" always;
    }

    location = /llms.txt {
        add_header Link "</sitemap.xml>; rel=\"sitemap\", </about>; rel=\"about\"" always;
        default_type text/plain;
    }

    location / {
        try_files $uri $uri.html =404;
    }
}
