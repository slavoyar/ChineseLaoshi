# Runs only after CI — Frontend succeeds on a push to production.
# Does not run on pull requests.
name: Deploy — Production

on:
  workflow_run:
    workflows: ["CI — Frontend"]
    types: [completed]
    branches: [production]

env:
  IMAGE_NAME: chineselaoshi
  REGISTRY: ghcr.io

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:sha-${{ github.event.workflow_run.head_sha }}

      - name: Trigger Coolify deploy
        run: >
          curl --fail --silent --show-error
          --request POST "${{ secrets.COOLIFY_WEBHOOK }}"
          --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
