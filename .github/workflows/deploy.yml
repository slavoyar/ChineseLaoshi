name: Deploy to server

on:
  push:
    branches:
      - production
  workflow_dispatch:

env:
  IMAGE_NAME: chineselaoshi
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.repository_owner }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --build-arg "VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy on server
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          DOMAIN: ${{ secrets.DOMAIN }}
          NETWORK: ${{ secrets.NETWORK }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEFAULT_USER_EMAIL: ${{ secrets.DEFAULT_USER_EMAIL }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
            set -e
            docker pull "${IMAGE}"
            docker stop ${{ env.IMAGE_NAME }} || true
            docker rm ${{ env.IMAGE_NAME }} || true
            docker volume create chineselaoshi_pg || true
            docker run -d \
              --name ${{ env.IMAGE_NAME }} \
              --network "${NETWORK}" \
              --env "VIRTUAL_HOST=${DOMAIN}" \
              --env "LETSENCRYPT_HOST=${DOMAIN}" \
              --env "LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}" \
              --env "NODE_ENV=production" \
              --env "PORT=3000" \
              --env "DATA_DIR=/app/data/pg" \
              --env "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
              --env "JWT_SECRET=${JWT_SECRET}" \
              --env "ALLOWED_ORIGINS=https://${DOMAIN}" \
              --env "DEFAULT_USER_EMAIL=${DEFAULT_USER_EMAIL}" \
              --volume chineselaoshi_pg:/app/data \
              --restart=always \
              "${IMAGE}"
            docker image prune -f
          EOF
