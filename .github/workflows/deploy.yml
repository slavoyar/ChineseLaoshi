# Keep this workflow name: branch protection requires
# "Lint, build and test frontend / lint-and-build".
name: Lint, build and test frontend
on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production
  workflow_dispatch:

env:
  IMAGE_NAME: chineselaoshi
  REGISTRY: ghcr.io

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "23.9.0"

      - run: npm install

      - run: npm run lint

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  deploy:
    needs: lint-and-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Trigger Coolify deploy
        run: >
          curl --fail --silent --show-error
          --request GET "${{ secrets.COOLIFY_WEBHOOK }}"
          --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
