# Manual ops workflow. Production normally migrates on server boot (db.Bootstrap → runMigrations).
# Use this to apply migrations directly against secrets.DB_URL when needed.
name: Migrate — Manual

on:
  workflow_dispatch:
  # Optional: re-enable auto-migrate on push when desired
  # push:
  #   paths:
  #     - "backend/migrations/**"
  #   branches:
  #     - production

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install golang-migrate
        run: go install -tags "postgres" github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Migrate database
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: migrate -path backend/migrations -database "$DB_URL" up
