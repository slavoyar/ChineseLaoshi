name: Lint, build and test frontend

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'shared/**'
    branches:
      - production

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2

      - name: Install dependencies
        run: npm install

      - name: Lint all packages
        run: npm run lint

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
