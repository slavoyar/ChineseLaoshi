name: Lint, build and test backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'shared/**'
    branches:
      - production

jobs:
  lint-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Verify generated types
        run: |
          go install github.com/gzuidhof/tygo@latest
          tygo generate
          git diff --exit-code shared/generated/index.ts

      - name: Download Go modules
        working-directory: ./backend
        run: go mod download

      - name: Test backend
        working-directory: ./backend
        run: go test ./... -count=1

      - name: Build backend
        working-directory: ./backend
        run: go build -o /dev/null ./cmd/server

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23.9.0'

      - name: Install dependencies
        run: npm install

      - name: Lint frontend and shared
        run: npm run lint
